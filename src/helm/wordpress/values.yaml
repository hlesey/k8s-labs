# groundhog2k/wordpress (official docker.io/wordpress image; bitnami images are no longer published)
# use ClusterIP service
# enable HTTPRoute

service:
  type: ClusterIP

httpRoute:
  enabled: true
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
  hostnames:
    - wordpress.clusterx.qedzone.ro

# bundled MariaDB; sizes bind the PVs from pv.yaml
storage:
  requestedSize: 10Gi

mariadb:
  enabled: true
  storage:
    requestedSize: 8Gi
