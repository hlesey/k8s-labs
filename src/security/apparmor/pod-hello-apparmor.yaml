apiVersion: v1
kind: Pod
metadata:
  name: hello-apparmor
spec:
  securityContext:
    appArmorProfile:
      type: Localhost
      localhostProfile: k8s-apparmor-example-deny-write
  containers:
  - name: hello
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sh", "-c", "echo 'Hello AppArmor!' && sleep 1h"]
