apiVersion: v1
kind: Pod
metadata:
  name: apparmor-missing
  namespace: lab-hardening
spec:
  nodeName: <worker-node-name>
  containers:
  - name: app
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sh", "-c", "sleep 1h"]
    securityContext:
      appArmorProfile:
        type: Localhost
        localhostProfile: k8s-missing
