apiVersion: v1
kind: Pod
metadata:
  name: apparmor-mixed
  namespace: lab-hardening
spec:
  nodeSelector:
    "node-role.kubernetes.io/node01" : ""
  containers:
  - name: locked
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sh", "-c", "sleep 1h"]
    securityContext:
      appArmorProfile:
        type: Localhost
        localhostProfile: k8s-deny-write
  - name: default
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sh", "-c", "sleep 1h"]
