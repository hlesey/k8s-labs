apiVersion: v1
kind: Pod
metadata:
  name: apparmor-mixed
  namespace: lab-hardening
spec:
  nodeName: <worker-node-name>
  containers:
  - name: locked
    image: busybox:1.36
    command: ["sh", "-c", "sleep 1h"]
    securityContext:
      appArmorProfile:
        type: Localhost
        localhostProfile: k8s-deny-write
  - name: default
    image: busybox:1.36
    command: ["sh", "-c", "sleep 1h"]
