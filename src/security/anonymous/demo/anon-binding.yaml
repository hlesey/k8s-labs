# Demo (Cluster Hardening 1.3): the mistake - "view" for every unauthenticated client.
# Apply, show the anonymous curl, then delete it right away.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oops
  namespace: anon-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:unauthenticated
