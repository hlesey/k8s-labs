apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-no-latest
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: badContainers
    expression: >-
      object.spec.containers.filter(c,
        !c.image.contains('@sha256:') &&
        (!c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') ||
          c.image.endsWith(':latest')))
  validations:
  - expression: "size(variables.badContainers) == 0"
    messageExpression: "'tag mutabil (latest sau lipsa) in containerele: ' + variables.badContainers.map(c, c.name).join(', ')"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-no-latest-binding
spec:
  policyName: lab-no-latest
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        security-lab: admission
