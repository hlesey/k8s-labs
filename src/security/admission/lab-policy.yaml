apiVersion: v1
kind: Namespace
metadata:
  name: lab-admission
  labels:
    security-lab: admission
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-image-prefix
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  validations:
  - expression: "object.spec.containers.all(c, c.image.startsWith('registry.k8s.io/')) && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.startsWith('registry.k8s.io/'))) && (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, c.image.startsWith('registry.k8s.io/')))"
    message: "Lab Pods must use images from registry.k8s.io"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-image-prefix-binding
spec:
  policyName: lab-image-prefix
  validationActions: [Warn]
  matchResources:
    namespaceSelector:
      matchLabels:
        security-lab: admission
