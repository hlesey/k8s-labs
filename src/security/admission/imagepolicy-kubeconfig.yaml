# Slide: Admission Controllers 3.2 - placeholder server and certificates
apiVersion: v1
kind: Config
clusters:
- name: image-checker
  cluster:
    server: https://images.example.com/policy
    certificate-authority: /etc/kubernetes/epconfig/ca.crt
contexts:
- context:
    cluster: image-checker
    user: api-server
  name: image-policy-context
current-context: image-policy-context
users:
- name: api-server
  user:
    client-certificate: /etc/kubernetes/epconfig/client.crt
    client-key: /etc/kubernetes/epconfig/client.key
