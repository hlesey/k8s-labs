# Slide: Cluster Hardening 3.3 - profile at /var/lib/kubelet/seccomp/profiles/fine-grained.json
# fine-grained.json is x86-only: on arm64 nodes the container fails to start (see the lab, step n)
apiVersion: v1
kind: Pod
metadata:
  name: seccomp-localhost
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/fine-grained.json
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 1h"]
