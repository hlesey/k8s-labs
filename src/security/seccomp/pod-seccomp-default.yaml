apiVersion: v1
kind: Pod
metadata:
  name: seccomp-default
  namespace: lab-hardening
spec:
  nodeSelector:
    "node-role.kubernetes.io/node01" : ""
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sh", "-c", "echo 'Seccomp active!' && sleep 1h"]
