apiVersion: v1
kind: Pod
metadata:
  name: sc-none
spec:
  containers:
  - name: app
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: sc-default
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sleep", "3600"]
