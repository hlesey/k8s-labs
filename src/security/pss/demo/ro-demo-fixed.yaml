# Demo (Pod Security Standards 6.1): same Pod, writable emptyDir only where the app writes
apiVersion: v1
kind: Pod
metadata:
  name: ro-demo
spec:
  containers:
  - name: app
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sh", "-c", "date > /tmp/started && sleep 3600"]
    securityContext:
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
