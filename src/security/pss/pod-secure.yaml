apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: lab-pss
spec:
  securityContext:
    sysctls:
    # non-root nginx can bind port 80 without NET_BIND_SERVICE (a "safe" sysctl, allowed by restricted)
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
  containers:
  - name: nginx
    image: ghcr.io/hlesey/nginx:1.27
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: cache
      mountPath: /var/cache/nginx   # client/proxy temp directories
    - name: run
      mountPath: /run               # nginx.pid
  volumes:
  - name: cache
    emptyDir: {}
  - name: run
    emptyDir: {}
