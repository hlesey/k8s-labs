apiVersion: v1
kind: Pod
metadata:
  name: caps-test
  namespace: lab-pss-rollout
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sleep", "3600"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE"]   # allowed; NET_ADMIN is rejected
