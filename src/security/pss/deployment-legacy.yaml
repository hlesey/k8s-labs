apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: lab-pss-rollout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy
  template:
    metadata:
      labels:
        app: legacy
    spec:
      containers:
      - name: legacy
        image: ghcr.io/hlesey/busybox:1.36.1
        command: ["sleep", "3600"]
