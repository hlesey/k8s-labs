customRules:
  lab-rules.yaml: |-
    - rule: Lab wget in container
      desc: wget executat intr-un container din lab-runtime
      condition: spawned_process and container and proc.name = wget and k8s.ns.name = "lab-runtime"
      output: "wget in container (ns=%k8s.ns.name pod=%k8s.pod.name container=%container.id cmd=%proc.cmdline uid=%user.uid)"
      priority: WARNING

    - macro: container_entrypoint
      condition: (not proc.pname exists or proc.pname in (runc:[0:PARENT], runc:[1:CHILD], runc, docker-runc, exe, docker-runc-cur, containerd-shim, systemd, crio, conmon, crun))
      override:
        condition: replace
