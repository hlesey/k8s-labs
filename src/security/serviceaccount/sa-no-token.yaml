apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-token
  namespace: lab-hardening
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: sa-none-pod
  namespace: lab-hardening
spec:
  serviceAccountName: no-token
  containers:
  - name: app
    image: ghcr.io/hlesey/busybox:1.36.1
    command: ["sleep", "3600"]
