apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-token
  namespace: lab-hardening
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: sa-none
  namespace: lab-hardening
spec:
  serviceAccountName: no-token
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
